# 毎朝の放送（全チャンネル）：ニュースを集めて台本を書き（Claude API）、声を作り（VOICEVOX）、GitHub Pages に公開する。
# 1 つのチャンネルが失敗しても、ほかのチャンネルは放送して公開します。ニュースが足りないチャンネルはその日お休み。
# 必要な設定：Settings → Secrets and variables → Actions に ANTHROPIC_API_KEY を登録
#            Settings → Pages の公開元を「gh-pages ブランチ / (root)」に
name: 毎朝の放送

on:
  schedule:
    - cron: "17 21 * * *"   # 日本時間 06:17 ごろ（GitHub の混み具合で数分〜数十分遅れることがあります）
  workflow_dispatch:
    inputs:
      channels:
        description: "放送するチャンネル（カンマ区切り。空なら全部。例：ai,tech）"
        required: false
      date:
        description: "放送日（YYYY-MM-DD。空なら今日）"
        required: false
      force:
        description: "その日の台本と声を作り直す"
        type: boolean
        default: false
      publish_only:
        description: "台本・声は作らず、公開だけやり直す"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: broadcast
  cancel-in-progress: false

env:
  VOICEVOX_VERSION: "0.26.1"
  TZ: Asia/Tokyo

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 放送日を決める
        id: day
        run: |
          D="${{ github.event.inputs.date }}"
          [ -n "$D" ] || D=$(date +%F)
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "放送日: $D"

      - name: サイトの公開先を channels.json に書く（初回だけ）
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          owner, repo = os.environ["GITHUB_REPOSITORY"].split("/")
          c = json.load(open("channels.json", encoding="utf-8"))
          if not c["site"].get("url"):
              url = f"https://{owner.lower()}.github.io/" + ("" if repo.lower() == f"{owner.lower()}.github.io" else f"{repo}/")
              subprocess.run(["python3", "tools/site.py", "set-url", url, f"https://github.com/{owner}/{repo}"], check=True)
          else:
              print("site:", c["site"]["url"])
          EOF

      - name: 道具を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk p7zip-full > /dev/null
          pip install -q pillow resvg-py

      - name: VOICEVOX をキャッシュから戻す
        if: github.event.inputs.publish_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/voicevox
          key: voicevox-linux-cpu-x64-${{ env.VOICEVOX_VERSION }}

      - name: VOICEVOX を用意して起動する
        if: github.event.inputs.publish_only != 'true'
        run: |
          if [ ! -x ~/voicevox/linux-cpu-x64/run ]; then
            mkdir -p ~/voicevox && cd ~/voicevox
            base=https://github.com/VOICEVOX/voicevox_engine/releases/download/$VOICEVOX_VERSION/voicevox_engine-linux-cpu-x64-$VOICEVOX_VERSION.7z
            curl -sSfL -o engine.7z.001 "$base.001"
            for i in 002 003 004; do curl -sSfL -o engine.7z.$i "$base.$i" 2>/dev/null || break; done
            7z x -y engine.7z.001 > /dev/null
            rm -f engine.7z.*
            chmod +x linux-cpu-x64/run
          fi
          cd ~/voicevox/linux-cpu-x64
          nohup ./run --host 127.0.0.1 --port 50021 > ~/voicevox/engine.log 2>&1 &
          for i in $(seq 60); do curl -s 127.0.0.1:50021/version && break; sleep 3; done

      - name: これまでの声を gh-pages から戻す
        run: |
          if git fetch -q --depth=1 origin gh-pages 2>/dev/null; then
            mkdir -p /tmp/pages && git archive FETCH_HEAD channels | tar -x -C /tmp/pages 2>/dev/null || true
            for d in /tmp/pages/channels/*/audio; do
              [ -d "$d" ] || continue
              cid=$(basename "$(dirname "$d")")
              [ -d "channels/$cid" ] && mkdir -p "channels/$cid/audio" && cp -n "$d"/* "channels/$cid/audio/" 2>/dev/null || true
            done
          fi
          ls channels/*/audio 2>/dev/null | tail -20 || echo "まだ声はありません"

      - name: 台本と声を作る（全チャンネル）
        id: make
        if: github.event.inputs.publish_only != 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: |
          python3 tools/broadcast.py --date "${{ steps.day.outputs.date }}" \
            ${{ github.event.inputs.channels && format('--channels {0}', github.event.inputs.channels) || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: 台本を main に記録する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels.json channels/*/episodes channels/*/episodes.json
          if git diff --cached --quiet; then echo "変更なし"; else git commit -q -m "放送 ${{ steps.day.outputs.date }}" && git push -q; fi

      - name: GitHub Pages に公開する
        env:
          PUBLISH_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          SHARE_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Medium.ttc
        run: bash tools/publish.sh

      - name: 失敗したチャンネルがあれば知らせる
        if: steps.make.outcome == 'failure'
        run: |
          echo "::error::放送に失敗したチャンネルがあります（上の「台本と声を作る」の記録と、この実行の Summary を見てください）"
          tail -30 ~/voicevox/engine.log 2>/dev/null || true
          exit 1
